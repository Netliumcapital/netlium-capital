# .github/workflows/deploy-preview.yml
name: Deploy Preview

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Marketing Site
        id: deploy-marketing
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
          working-directory: apps/marketing
          vercel-args: '--build-env NODE_ENV=preview'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy Dashboard
        id: deploy-dashboard
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_DASHBOARD_PROJECT_ID }}
          working-directory: apps/dashboard
          vercel-args: '--build-env NODE_ENV=preview'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy API
        id: deploy-api
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          working-directory: apps/api
          vercel-args: '--build-env NODE_ENV=preview'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Preview Deployments Ready**
            
            | App | URL |
            |:---|:---|
            | Marketing | ${{ steps.deploy-marketing.outputs.preview-url }} |
            | Dashboard | ${{ steps.deploy-dashboard.outputs.preview-url }} |
            | API | ${{ steps.deploy-api.outputs.preview-url }} |
            
            🔗 [View All Deployments](https://vercel.com/${{ secrets.VERCEL_ORG_ID }})
